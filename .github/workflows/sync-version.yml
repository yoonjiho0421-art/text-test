name: Sync release version

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '동기화할 Git 태그 (예: v1.1.21)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-release-version
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version from Git tag
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python3 scripts/sync-version.py "$TAG_NAME"

      - name: Commit synchronized version files to default branch
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json sw.js README.md
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore: sync app version to ${TAG_NAME}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      # 중요: 태그는 이벤트가 발생한 기존 커밋에 고정되어 있으므로,
      # 동기화 커밋을 만든 뒤 태그도 그 커밋으로 이동시킨다.
      # 따라서 태그 / Release / GitHub Pages 소스가 같은 버전을 가리킨다.
      - name: Move tag to synchronized commit
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git config --get remote.origin.url >/dev/null
          git fetch origin "${{ github.event.repository.default_branch }}" --force
          git checkout "${{ github.event.repository.default_branch }}"
          git pull --ff-only origin "${{ github.event.repository.default_branch }}"
          git tag -fa "$TAG_NAME" -m "Release $TAG_NAME" HEAD
          git push origin "$TAG_NAME" --force

      - name: Build release ZIP
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          PACKAGE="text-test-${VERSION}"
          mkdir -p "dist/${PACKAGE}"
          cp -r index.html manifest.json sw.js README.md icon-192.png icon-512.png icon-maskable-512.png "dist/${PACKAGE}/"
          cd dist
          zip -qr "${PACKAGE}.zip" "${PACKAGE}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          fi
          gh release upload "$TAG_NAME" "dist/text-test-${VERSION}.zip" --clobber
