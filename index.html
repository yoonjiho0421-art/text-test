<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어장 퀴즈 앱 - 최적화 버전</title>
    <style>
        /* 1. UI 디자인 통일 (UI Standardization) */
        :root {
            /* 색상 시스템 통일 */
            --ink: #1f2937;
            --paper: #ffffff;
            --paper-sub: #f3f4f6;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #e5e7eb;
            
            /* 테두리 둥기(Border Radius) 규격화 */
            --radius-card: 16px;
            --radius-element: 8px;
            --radius-round: 999px;
            
            /* 여백(Spacing) 표준화 (8px 배수) */
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--paper-sub);
            color: var(--ink);
            margin: 0;
            padding: var(--spacing-lg);
            box-sizing: border-box;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 컨테이너 규격화 (Padding, Margin 통일) */
        .upload-card, .quiz-card, .modal-card {
            background-color: var(--paper);
            border-radius: var(--radius-card);
            padding: var(--spacing-lg);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: var(--spacing-lg);
        }

        h1, h2 {
            margin-top: 0;
            margin-bottom: var(--spacing-md);
        }

        /* 입력 폼 상태 표시 일관성 (Focus, Hover 효과 추가) */
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--border);
            border-radius: var(--radius-element);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            box-sizing: border-box;
            font-size: 16px;
            margin-bottom: var(--spacing-md);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* 버튼 상태 통일 */
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px var(--spacing-md);
            border-radius: var(--radius-element);
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.05s ease;
            font-size: 16px;
            font-weight: 500;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        /* 리스트 스타일 통일 */
        .word-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-element);
            background: var(--paper);
        }

        .word-item {
            padding: var(--spacing-sm) var(--spacing-md);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .word-item:last-child {
            border-bottom: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>단어장 앱 (최적화 버전)</h1>

    <!-- 엑셀/데이터 업로드 영역 -->
    <div class="upload-card">
        <h2>단어 업로드</h2>
        <input type="file" id="fileUpload" accept=".csv, .xlsx">
        <button id="uploadBtn">대용량 더미 데이터 로드 (테스트용)</button>
    </div>

    <!-- 단어 검색 및 리스트 영역 -->
    <div class="modal-card">
        <h2>단어 목록</h2>
        <div id="groupBarEl" style="margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap;">
            <!-- 상태별 그룹화 표시 등 -->
        </div>
        <!-- 검색어 입력: 디바운싱 적용됨 -->
        <input type="text" id="searchBox" placeholder="단어 검색 (디바운싱 300ms 적용)..." style="margin-bottom: 0;">
        <ul id="groupListEl" class="word-list" style="margin-top: 16px;">
            <li class="word-item" style="justify-content: center; color: #6b7280;">업로드 버튼을 눌러 데이터를 불러오세요.</li>
        </ul>
    </div>

    <!-- 퀴즈 영역 -->
    <div class="quiz-card">
        <h2 id="quizTitle" style="cursor: grab;">단어 퀴즈 (드래그 테스트 영역)</h2>
        <p id="quizWord" style="font-size: 24px; font-weight: bold; margin-bottom: 16px;">Apple</p>
        <input type="text" id="quizAnswer" placeholder="정답을 입력하고 Enter를 누르세요.">
        <button id="submitQuiz">제출</button>
    </div>

    <script>
        /**
         * 전역 상태 관리 (메모리 캐싱)
         * - 로컬스토리지 I/O 병목 완화 (Lazy Save 적용)
         */
        const AppState = {
            words: [],
            testSettings: {},
            answersRecord: {},
            isDirty: false
        };

        // 메모리에 캐시 후 플래그 변경
        function syncTestSettingsFromUI(settings) {
            AppState.testSettings = { ...AppState.testSettings, ...settings };
            AppState.isDirty = true;
        }

        function recordWordAnswer(wordId, isCorrect) {
            AppState.answersRecord[wordId] = isCorrect;
            AppState.isDirty = true;
        }

        // 페이지 종료 또는 전환 시 한 번에 LocalStorage로 직렬화하여 저장 (성능 최적화)
        window.addEventListener('beforeunload', () => {
            if (AppState.isDirty) {
                localStorage.setItem('vocabulary_answers', JSON.stringify(AppState.answersRecord));
                localStorage.setItem('vocabulary_settings', JSON.stringify(AppState.testSettings));
            }
        });

        /**
         * 버그 수정: 엔터 키 이벤트 위임 충돌 방지
         */
        let lastEnterHandledAt = 0;
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const now = Date.now();
                // 200ms 디바운스로 중복 입력 방지
                if (now - lastEnterHandledAt < 200) return;
                
                const activeEl = document.activeElement;
                
                // 포커스가 정확히 '퀴즈 답안창'일 때만 이벤트 발생하도록 타겟 검증
                if (activeEl && activeEl.id === 'quizAnswer') {
                    lastEnterHandledAt = now;
                    submitQuizLogic();
                    e.preventDefault(); // 기본 폼 제출 방지
                }
            }
        });

        function submitQuizLogic() {
            const answerEl = document.getElementById('quizAnswer');
            const answer = answerEl.value.trim();
            if(!answer) return;
            
            // 퀴즈 결과 기록 (스토리지 직렬화 없이 메모리에만 저장)
            recordWordAnswer('word_apple', answer === '사과');
            answerEl.value = '';
            alert(`'${answer}' 제출됨! (상태가 메모리에 기록되었습니다)`);
        }

        document.getElementById('submitQuiz').addEventListener('click', submitQuizLogic);

        /**
         * 버그 수정: 드래그 앤 드롭 이벤트 누수 방지 (Pointer Capture 예외 처리)
         */
        function bindAccuracyGroupDrag(element) {
            element.addEventListener('pointerdown', (e) => {
                try {
                    element.setPointerCapture(e.pointerId);
                    element.style.opacity = '0.5';
                    element.style.cursor = 'grabbing';
                } catch (err) {
                    console.error('Pointer capture failed:', err);
                }
            });

            const releaseCapture = (e) => {
                try {
                    if (element.hasPointerCapture(e.pointerId)) {
                        element.releasePointerCapture(e.pointerId);
                    }
                } catch (err) {}
                element.style.opacity = '1';
                element.style.cursor = 'grab';
            };

            element.addEventListener('pointerup', releaseCapture);
            // 마우스 화면 이탈 등의 예외 상황을 방어하는 pointercancel 추가
            element.addEventListener('pointercancel', releaseCapture); 
        }
        bindAccuracyGroupDrag(document.getElementById('quizTitle'));

        /**
         * 성능 최적화: 검색 디바운싱(Debouncing) 적용
         */
        function debounce(func, delay) {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => func.apply(this, args), delay);
            };
        }

        const searchBox = document.getElementById('searchBox');
        searchBox.addEventListener('input', debounce((e) => {
            const filter = e.target.value.trim().toLowerCase();
            
            // 데이터 필터링 예외 복구: 검색어를 모두 지웠을 때 빈 화면 방지
            if (filter === '') {
                renderWordList(AppState.words); 
                return;
            }

            const filtered = AppState.words.filter(w => 
                w.en.toLowerCase().includes(filter) || 
                w.ko.includes(filter)
            );
            renderWordList(filtered);
        }, 300));

        /**
         * 성능 최적화: 대규모 DOM 업데이트 효율화 (Chunk Rendering + DocumentFragment)
         * innerHTML 전체 교체로 인한 브라우저 멈춤 방지
         */
        function renderWordList(words) {
            const listEl = document.getElementById('groupListEl');
            listEl.innerHTML = ''; // 기존 리스트 비우기

            if (words.length === 0) {
                listEl.innerHTML = '<li class="word-item" style="justify-content:center;">검색 결과가 없습니다.</li>';
                return;
            }

            let currentIndex = 0;
            const chunkSize = 50; // 한 번에 그릴 아이템 개수

            function renderChunk() {
                const fragment = document.createDocumentFragment();
                const end = Math.min(currentIndex + chunkSize, words.length);

                for (let i = currentIndex; i < end; i++) {
                    const li = document.createElement('li');
                    li.className = 'word-item';
                    
                    const enSpan = document.createElement('strong');
                    enSpan.textContent = words[i].en;
                    
                    const koSpan = document.createElement('span');
                    koSpan.textContent = words[i].ko;
                    koSpan.style.color = '#4b5563';

                    li.appendChild(enSpan);
                    li.appendChild(koSpan);
                    fragment.appendChild(li);
                }

                listEl.appendChild(fragment);
                currentIndex += chunkSize;

                // 렌더링할 데이터가 남았다면 다음 애니메이션 프레임으로 넘김 (메인 스레드 블로킹 해제)
                if (currentIndex < words.length) {
                    requestAnimationFrame(renderChunk);
                }
            }

            // 청크 렌더링 시작
            requestAnimationFrame(renderChunk);
        }

        /**
         * 더미 데이터 로딩 테스트
         */
        document.getElementById('uploadBtn').addEventListener('click', () => {
            // 대용량 처리를 테스트하기 위한 2,000개의 임의 단어 데이터 생성
            const dummyWords = Array.from({length: 2000}, (_, i) => ({
                id: `w_${i}`,
                en: `Word ${i}`,
                ko: `단어 뜻 ${i}`
            }));
            
            AppState.words = dummyWords;
            renderWordList(AppState.words);
            alert('2,000개의 데이터가 청크(Chunk) 단위로 렌더링되었습니다.\n(브라우저 멈춤 없이 로딩됨)');
        });

    </script>
</body>
</html>
